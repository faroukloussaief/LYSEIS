[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyseis"
version = "0.1.0"
description = "JavaScript Reconnaissance Tool for offensive security research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "rich>=13.7.0",
    "cloudscraper>=2.3.7",
]

[project.scripts]
lyseis = "lyseis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lyseis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
